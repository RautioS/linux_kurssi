<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Tervetuloa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        h1 {
            font-size: 3em;
        }
        #time {
            font-size: 2em;
            margin: 20px 0;
        }
        .btn-container {
            margin-top: 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            font-size: 1.2em;
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Tervetuloa uusille sivuilleni!</h1>
    <div id="time">Ladataan kellonaikaa...</div>

 <div class="btn-container">
    <a class="btn" href="https://github.com/RautioS/linux_kurssiub" target="_blank">
        Siirry GitHubiin
    </a>

    <a class="btn" href="http://86.50.23.56/data-analysis/" target="_blank">
        Siirry Data-analyysiin
    </a>
</div>


    <script>
        function fetchTime() {
            fetch('/time')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('time').textContent = "MySQL-palvelimen aika: " + data.time;
                })
                .catch(error => {
                    document.getElementById('time').textContent = "Virhe kellonajassa";
                });
        }

        fetchTime();
        setInterval(fetchTime, 1000);
    </script>
</body>
</html>
