<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Tervetuloa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        h1 {
            font-size: 3em;
        }
        #time {
            font-size: 2em;
            margin: 20px 0;
        }
        footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Tervetuloa uusille sivuilleni!</h1>
    <div id="time">Ladataan kellonaikaa...</div>

    
 <div style="margin-top: 30px;">
        https://github.com/RautioS/linux_kurssi
            Avaa GitHub
        </button>

        /data-analysis/
            Siirry Data-analyysiin
        </button>
    </div>



    <script>
        function fetchTime() {
            fetch('/time')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('time').textContent = "MySQL-palvelimen aika: " + data.time;
                })
                .catch(error => {
                    document.getElementById('time').textContent = "Virhe kellonajassa";
                });
        }

        fetchTime(); // Lataa heti
        setInterval(fetchTime, 1000); // Päivitä joka sekunti
    </script>
</body>
</html>
